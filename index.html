<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Планувальник меню</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-emerald-600 text-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-3">
      <h1 class="text-xl font-bold">🍽️ Планувальник меню</h1>
      <nav id="tabs" class="flex gap-1 mt-3 overflow-x-auto text-sm"></nav>
    </div>
  </header>

  <main id="view" class="max-w-5xl mx-auto px-4 py-5"></main>

  <!-- Універсальне модальне вікно -->
  <dialog id="modal" class="rounded-xl p-0 w-[92vw] max-w-lg backdrop:bg-black/50">
    <form id="modal-form" class="p-5 space-y-4">
      <h2 id="modal-title" class="text-lg font-bold"></h2>
      <div id="modal-body" class="space-y-3"></div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" id="modal-cancel" class="px-4 py-2 rounded-lg bg-slate-200">Скасувати</button>
        <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-600 text-white">Зберегти</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
